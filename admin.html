<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dumoba Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="layout">
    <!-- Sidebar -->
    <aside class="side">
      <a class="brand" href="admin.html">
        <img src="assets/logo-icon.png" alt="" width="40" height="40">
        <span><b>Dumoba</b> Admin</span>
      </a>
      <nav class="side__nav" aria-label="Admin sections">
        <button type="button" data-tab="dashboard" class="is-active"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 3h8v8H3zM13 3h8v5h-8zM13 10h8v11h-8zM3 13h8v8H3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Dashboard</button>
        <button type="button" data-tab="products"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Products <span class="pill" id="nav-count">0</span></button>
        <button type="button" data-tab="categories"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 5h6v6H4zM14 5h6v6h-6zM4 15h6v4H4zM14 15h6v4h-6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Categories</button>
        <button type="button" data-tab="banners"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m3 16 5-5 4 4 3-3 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Banners</button>
        <button type="button" data-tab="settings"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>Store settings</button>
      </nav>
      <div class="side__foot">
        <a class="side__view" href="index.html" target="_blank" rel="noopener">View store ↗</a>
      </div>
    </aside>

    <!-- Main -->
    <div class="main">
      <header class="top">
        <div>
          <h1 id="page-title">Dashboard</h1>
          <p class="top__status" id="status">Not connected</p>
        </div>
        <div class="top__actions">
          <button class="btn btn--ghost" type="button" id="connect">Connect store folder</button>
          <button class="btn" type="button" id="save" disabled>Save changes</button>
        </div>
      </header>

      <div class="notice" id="notice" hidden></div>

      <main id="view"></main>
    </div>
  </div>

  <!-- Product editor -->
  <dialog class="modal" id="editor" aria-labelledby="editor-title">
    <form class="modal__in" id="editor-form" method="dialog" novalidate>
      <header class="modal__head">
        <h2 id="editor-title">Add product</h2>
        <button class="x" type="button" data-close aria-label="Close">×</button>
      </header>
      <div class="modal__body editor">
        <div class="editor__img">
          <label class="drop" id="drop">
            <img id="ed-preview" alt="" hidden>
            <span class="drop__hint" id="drop-hint">
              <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <b>Add a photo</b><small>Click or drop an image here. It is resized for the web automatically.</small>
            </span>
            <input type="file" id="ed-file" accept="image/*" class="visually-hidden">
          </label>
          <button class="link" type="button" id="ed-file-change" hidden>Change photo</button>
        </div>
        <div class="editor__fields">
          <label class="field field--full"><span>Product name *</span><input name="name" required maxlength="120" placeholder="e.g. Red Canvas Sneakers"></label>
          <label class="field"><span>Category *</span><select name="category" required></select></label>
          <label class="field"><span>Label on photo</span><input name="tag" maxlength="20" placeholder="e.g. New, Bestseller"></label>
          <label class="field"><span>Price (₦) *</span><input name="price" type="number" min="0" step="1" required inputmode="numeric" placeholder="25000"></label>
          <label class="field"><span>Old price (₦)</span><input name="oldPrice" type="number" min="0" step="1" inputmode="numeric" placeholder="Leave empty if not on sale" aria-describedby="old-help"><small id="old-help">Higher than the price → shows a discount and puts it in Flash Sales.</small></label>
          <label class="field"><span>Units in stock</span><input name="stock" type="number" min="0" step="1" inputmode="numeric" placeholder="e.g. 12"></label>
          <label class="check"><input name="featured" type="checkbox"> <span>Feature on the home page</span></label>
          <label class="field field--full"><span>Description</span><textarea name="description" rows="3" maxlength="600" placeholder="One or two sentences about the product."></textarea></label>
          <div class="field field--full">
            <span>Details (size, colour, warranty…)</span>
            <div class="specs" id="ed-specs"></div>
            <button class="link" type="button" id="add-spec">+ Add a detail</button>
          </div>
        </div>
      </div>
      <footer class="modal__foot">
        <p class="err" id="ed-error" role="alert"></p>
        <button class="btn btn--ghost" type="button" data-close>Cancel</button>
        <button class="btn" type="submit">Save product</button>
      </footer>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/products.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
